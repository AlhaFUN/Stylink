name: Build Windows Companion

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "host/**"
      - "pc/**"
      - ".github/workflows/windows-companion.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packager
        run: python -m pip install --upgrade pyinstaller

      - name: Check Python source
        run: python -m compileall -q host pc

      - name: Check ADB parsing and receiver lifecycle
        run: python -m unittest pc.tests.test_companion -v

      - name: Build Windows app
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --paths . --name S23DrawingTabletPC --distpath release
          pc/tablet_companion.py

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: S23-Tablet-PC
          path: release/S23DrawingTabletPC.exe
          if-no-files-found: error
          retention-days: 30
