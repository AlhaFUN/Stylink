name: Build Windows Companion

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "host/**"
      - "pc/**"
      - ".github/workflows/windows-companion.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PC app dependencies
        run: python -m pip install --upgrade pyinstaller mss pillow

      - name: Check Python source
        run: python -m compileall -q host pc

      - name: Check tether discovery, screen selection, and phone connection lifecycle
        run: python -m unittest pc.tests.test_companion -v

      - name: Build Windows app
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --icon pc/assets/s23-drawing-tablet.ico
          --add-data "pc/assets/s23-drawing-tablet.ico;pc/assets"
          --collect-all mss --collect-all PIL
          --paths . --name VirtualDT --distpath release
          pc/tablet_companion.py

      - name: Assemble simple Windows setup files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\setup | Out-Null
          Copy-Item release\VirtualDT.exe release\setup\
          Copy-Item pc\README-Windows.txt release\setup\README.txt
          Copy-Item LICENSE release\setup\

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: VirtualDT-PC-Setup
          path: release/setup/*
          if-no-files-found: error
          retention-days: 30
